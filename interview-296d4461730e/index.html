<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Live Interview · Ticket Purchasing</title>
  <link rel="stylesheet" href="../styles.css?v=2026-10-01-interview-v1">
  <style>
    .interview-questions{margin:16px 0 0;padding:0;list-style:none;counter-reset:iq;display:grid;gap:12px}
    .interview-questions li{counter-increment:iq;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:17px;line-height:1.5}
    .interview-questions li::before{content:counter(iq);display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;font-weight:900;font-size:15px}
    .interview-nav .case-nav-track{grid-template-columns:1.4fr repeat(5,1fr)}
    .interview-tab-label{font-weight:850}
    @media(max-width:720px){.interview-nav .case-nav-track{grid-template-columns:repeat(5,minmax(0,1fr))}.interview-nav .interview-first{grid-column:1/-1}.interview-nav .interview-first::after{content:"Interview question"!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <div><p class="eyebrow">Live interview</p><h1>Ticket Purchasing Specialist</h1></div>
    </div>
  </header>

  <main class="shell">
    <section id="lockedGate" class="gate card" hidden>
      <p class="eyebrow">Private link required</p>
      <h2 id="lockedTitle">This page needs its private link</h2>
      <p id="lockedText">Open the full interview link, including everything after the # sign.</p>
    </section>

    <div id="interviewApp" hidden>
      <nav class="case-nav card interview-nav" aria-label="Interview sections">
        <div class="case-nav-track" id="sectionNav"></div>
      </nav>

      <section class="case-layout">
        <article class="evidence-card card" aria-labelledby="sectionTitle">
          <div class="case-heading">
            <div>
              <p class="eyebrow" id="sectionEyebrow"></p>
              <h2 id="sectionTitle"></h2>
              <p class="case-context" id="sectionContext"></p>
            </div>
            <div class="viewer-actions">
              <button type="button" data-zoom="fit">Fit</button>
              <button type="button" data-zoom="100">100%</button>
              <button type="button" data-zoom="140">140%</button>
              <button type="button" id="openImage">Open image</button>
            </div>
          </div>
          <div class="evidence-tabs" id="evidenceTabs" role="tablist" aria-label="Evidence images"></div>
          <div class="viewer" id="viewer" tabindex="0" aria-label="Evidence image viewer"><img id="evidenceImage" alt=""></div>
          <div class="evidence-caption"><span id="evidenceLabel"></span><span id="evidenceMeta"></span></div>
        </article>

        <aside class="task-column">
          <section class="task-card card">
            <p class="eyebrow" id="taskEyebrow">Question</p>
            <h2 id="taskTitle"></h2>
            <p id="taskPrompt"></p>
            <ol class="interview-questions" id="questionList" hidden></ol>
            <div class="inventory" id="inventory" hidden></div>
          </section>
        </aside>
      </section>
      <p class="footer-note">Private interview material · Not affiliated with Ticketmaster, StubHub, Vivid Seats or Automatiq</p>
    </div>
  </main>

  <dialog id="imageDialog">
    <button class="dialog-close" id="closeDialog" type="button" aria-label="Close full-screen image">Close</button>
    <img id="dialogImage" alt="">
  </dialog>

  <script src="../cases.js?v=2026-10-01-interview-v1"></script>
  <script src="interview.js?v=2026-10-01-interview-v1"></script>
</body>
</html>
