<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Live Interview · Ticket Purchasing</title>
  <link rel="stylesheet" href="../styles.css?v=2026-10-01-interview-v6">
  <style>
    .interview-questions{margin:16px 0 0;padding:0;list-style:none;counter-reset:iq;display:grid;gap:12px}
    .interview-questions li{counter-increment:iq;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:17px;line-height:1.5}
    .interview-questions li::before{content:counter(iq);display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;font-weight:900;font-size:15px}
    .interview-nav .case-nav-track{display:flex;flex-wrap:wrap}.interview-nav .case-tab{flex:1 1 0}
    .interview-tab-label{font-weight:850}
    .case-tab[aria-current="step"]:hover{background:var(--navy);border-color:var(--navy);color:#fff}
    /* Show the whole image on the page, scaled to fit; full size via "Open image" or a click. */
    .topbar{padding-block:12px}
    .shell{margin-top:14px}
    .case-nav{margin-bottom:12px}
    .evidence-toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd}
    .evidence-toolbar .evidence-tabs{flex:1;padding:0;border:0;background:none}
    .evidence-toolbar #openImage{flex:0 0 auto;white-space:nowrap}
    .task-card .case-context{margin:4px 0 14px}
    .task-subtitle{margin:0 0 6px;font-size:16px}
    /* Show the whole image on the page; --fit-height is set by interview.js. Full size via "Open full image" or a click. */
    .viewer{height:auto;min-height:0;overflow:visible;display:flex;justify-content:center;align-items:flex-start;padding:10px}
    .viewer img{max-width:100%;max-height:var(--fit-height,70vh);width:auto!important;height:auto;object-fit:contain;cursor:zoom-in}
    @media(max-width:1040px){.viewer img{max-height:none}}
    @media(max-width:720px){.interview-nav .case-tab{flex:1 1 0}.interview-nav .interview-tab::after{content:attr(data-number)!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <div><p class="eyebrow">Live interview</p><h1>Ticket Purchasing Specialist</h1></div>
    </div>
  </header>

  <main class="shell">
    <section id="lockedGate" class="gate card" hidden>
      <p class="eyebrow">Private link required</p>
      <h2 id="lockedTitle">This page needs its private link</h2>
      <p id="lockedText">Open the full interview link, including everything after the # sign.</p>
    </section>

    <div id="interviewApp" hidden>
      <nav class="case-nav card interview-nav" aria-label="Interview sections">
        <div class="case-nav-track" id="sectionNav"></div>
      </nav>

      <section class="case-layout">
        <article class="evidence-card card" aria-label="Evidence images">
          <div class="evidence-toolbar">
            <div class="evidence-tabs" id="evidenceTabs" role="tablist" aria-label="Evidence images"></div>
            <button type="button" class="secondary" id="openImage">Open full image</button>
          </div>
          <div class="viewer" id="viewer"><img id="evidenceImage" alt="" title="Click to open full image"></div>
          <div class="evidence-caption"><span id="evidenceLabel"></span><span id="evidenceMeta"></span></div>
        </article>

        <aside class="task-column">
          <section class="task-card card">
            <p class="eyebrow" id="sectionEyebrow"></p>
            <h2 id="sectionTitle"></h2>
            <p class="case-context" id="sectionContext"></p>
            <h3 class="task-subtitle" id="taskTitle" hidden></h3>
            <p id="taskPrompt"></p>
            <ol class="interview-questions" id="questionList" hidden></ol>
            <div class="inventory" id="inventory" hidden></div>
          </section>
        </aside>
      </section>
      <p class="footer-note">Private interview material · Not affiliated with Ticketmaster, StubHub, Vivid Seats or Automatiq</p>
    </div>
  </main>

  <dialog id="imageDialog">
    <button class="dialog-close" id="closeDialog" type="button" aria-label="Close full-screen image">Close</button>
    <img id="dialogImage" alt="">
  </dialog>

  <script src="../cases.js?v=2026-10-01-interview-v6"></script>
  <script src="interview.js?v=2026-10-01-interview-v6"></script>
</body>
</html>
